<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f7f7f7; margin:0; }
    .wrap { max-width:480px; margin:60px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    input, button { padding:10px; border:1px solid #ccc; border-radius:8px; width:100%; box-sizing:border-box; }
    button { border:0; background:#0f62fe; color:#fff; cursor:pointer; }
    .msg { margin-top:12px; padding:12px; border-radius:8px; display:none; }
    .ok { background:#e8f5e9; color:#1b5e20; }
    .err { background:#ffebee; color:#b71c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Login</h1>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="Enter your email" /></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password" /></div>
    <button onclick="login()">Login</button>
    <p style="margin-top:16px;">Don't have an account? <a href="/signup">Create account</a></p>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    function show(text, ok) {
      const el = document.getElementById('msg');
      el.className = ok ? 'msg ok' : 'msg err';
      el.style.display = 'block';
      el.textContent = text;
    }
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return show('Email and password are required', false);
      const res = await fetch('/client/login', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!data.ok) return show(data.error || 'Login failed', false);
      show('Login successful. Redirecting...', true);
      setTimeout(() => location.href = '/client-portal', 800);
    }
  </script>
</body>
</html>
