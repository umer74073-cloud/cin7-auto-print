<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Logs</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f7f7f7; color:#222; }
    .container { max-width:1100px; margin:32px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    .toolbar { display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin-bottom:20px; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:240px; }
    label { font-weight:bold; }
    select, input, button { padding:10px; border:1px solid #ccc; border-radius:8px; }
    button { cursor:pointer; border:0; }
    .primary { background:#0f62fe; color:#fff; }
    .secondary { background:#e5e5e5; color:#222; }
    .box { background:#fafafa; border:1px solid #ddd; border-radius:10px; padding:14px; white-space:pre-wrap; font-family:Consolas, monospace; font-size:13px; min-height:320px; overflow:auto; }
    .message { margin-top:12px; padding:12px; border-radius:8px; display:none; }
    .success { background:#e8f5e9; color:#1b5e20; }
    .error { background:#ffebee; color:#b71c1c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Client Logs</h1>
    <div class="toolbar">
      <div class="field"><label>Admin Password</label><input id="adminPassword" type="password" placeholder="Enter admin password" /></div>
      <div class="field"><label>Select Client</label><select id="clientSelect"><option value="">Select client</option></select></div>
      <button class="primary" onclick="loadLogs()">Load Logs</button>
      <button class="secondary" onclick="refreshClients()">Refresh Clients</button>
    </div>
    <div id="messageBox" class="message"></div>
    <div id="logsBox" class="box">Waiting...</div>
  </div>
  <script>
    function showMessage(text, ok) {
      const box = document.getElementById('messageBox');
      box.className = ok ? 'message success' : 'message error';
      box.style.display = 'block';
      box.textContent = text;
    }
    function getAdminPassword() {
      const value = document.getElementById('adminPassword').value.trim();
      if (value) return value;
      return new URLSearchParams(window.location.search).get('admin') || '';
    }
    function setAdminPasswordFromUrl() {
      const admin = new URLSearchParams(window.location.search).get('admin') || '';
      if (admin) document.getElementById('adminPassword').value = admin;
    }
    async function refreshClients() {
      const admin = getAdminPassword();
      if (!admin) return showMessage('Enter admin password first', false);
      const response = await fetch(`/admin/clients?admin=${encodeURIComponent(admin)}`);
      const result = await response.json();
      if (!result.ok) return showMessage(result.error || 'Failed to load clients', false);
      const select = document.getElementById('clientSelect');
      select.innerHTML = '<option value="">Select client</option>';
      result.clients.forEach(client => {
        const option = document.createElement('option');
        option.value = client.id;
        option.textContent = `${client.id} - ${client.name || client.email || 'Unnamed'}`;
        select.appendChild(option);
      });
      showMessage('Clients loaded successfully', true);
    }
    async function loadLogs() {
      const admin = getAdminPassword();
      const clientId = document.getElementById('clientSelect').value;
      if (!admin) return showMessage('Enter admin password first', false);
      if (!clientId) return showMessage('Please select a client', false);
      const response = await fetch(`/admin/clients/${clientId}/logs?admin=${encodeURIComponent(admin)}`);
      const result = await response.json();
      if (!result.ok) return showMessage(result.error || 'Failed to load logs', false);
      document.getElementById('logsBox').textContent = result.logs.length ? result.logs.map(log => log.message).join('\n') : 'No logs found for this client';
      showMessage(`Loaded logs for ${result.client.name}`, true);
    }
    setAdminPasswordFromUrl();
  </script>
</body>
</html>
