<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Client Editor</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f7f7f7; color:#222; }
    .container { max-width:1000px; margin:32px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    h1,h2 { margin-top:0; }
    h2 { margin-top:24px; border-bottom:1px solid #ddd; padding-bottom:8px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    label { font-weight:bold; }
    input, select, button { padding:10px; border:1px solid #ccc; border-radius:8px; width:100%; box-sizing:border-box; }
    button { cursor:pointer; border:0; }
    .primary { background:#0f62fe; color:#fff; }
    .secondary { background:#e5e5e5; color:#222; }
    .row { display:grid; grid-template-columns:1.4fr 1fr 110px 110px 110px; gap:10px; margin-bottom:10px; }
    .printer-head { font-weight:bold; }
    .buttons { display:flex; gap:12px; flex-wrap:wrap; margin-top:24px; }
    .msg { margin-top:12px; padding:12px; border-radius:8px; display:none; }
    .ok { background:#e8f5e9; color:#1b5e20; }
    .err { background:#ffebee; color:#b71c1c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Client Editor</h1>
    <div class="grid">
      <div class="field"><label>Admin Password</label><input id="adminPassword" type="password" placeholder="Enter admin password" /></div>
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="Client email (one account per email)" /></div>
      <div class="field"><label>Company Name</label><input id="name" type="text" placeholder="Company name" /></div>
      <div class="field"><label>Connection Code</label><input id="webhookSecret" type="text" placeholder="Webhook secret / code" /></div>
      <div class="field" style="grid-column:1 / span 2;"><label>PrintNode API Key</label><input id="printnodeApiKey" type="text" placeholder="PrintNode API key" /></div>
      <div class="field"><label>Active</label><select id="isActive"><option value="true">Yes</option><option value="false">No</option></select></div>
      <div class="field"><label>Setup Completed</label><select id="setupCompleted"><option value="true">Yes</option><option value="false">No</option></select></div>
    </div>

    <div class="buttons">
      <button class="secondary" onclick="fetchPrinters()">Fetch Printers</button>
      <button class="primary" onclick="saveClient()">Save Client</button>
      <button class="secondary" onclick="goToClientsPage()">Open Clients List</button>
    </div>

    <h2>Printers (Up to 5)</h2>
    <div class="row printer-head"><div>Printer Name</div><div>Printer ID</div><div>Priority</div><div>Default</div><div>Active</div></div>
    <div class="row"><input class="printer-name" type="text" /><input class="printer-id" type="number" /><select class="printer-priority"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select><select class="printer-default"><option value="true">Yes</option><option value="false">No</option></select><select class="printer-active"><option value="true">Yes</option><option value="false">No</option></select></div>
    <div class="row"><input class="printer-name" type="text" /><input class="printer-id" type="number" /><select class="printer-priority"><option value="2">2</option><option value="1">1</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select><select class="printer-default"><option value="false">No</option><option value="true">Yes</option></select><select class="printer-active"><option value="true">Yes</option><option value="false">No</option></select></div>
    <div class="row"><input class="printer-name" type="text" /><input class="printer-id" type="number" /><select class="printer-priority"><option value="3">3</option><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="5">5</option></select><select class="printer-default"><option value="false">No</option><option value="true">Yes</option></select><select class="printer-active"><option value="true">Yes</option><option value="false">No</option></select></div>
    <div class="row"><input class="printer-name" type="text" /><input class="printer-id" type="number" /><select class="printer-priority"><option value="4">4</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select><select class="printer-default"><option value="false">No</option><option value="true">Yes</option></select><select class="printer-active"><option value="true">Yes</option><option value="false">No</option></select></div>
    <div class="row"><input class="printer-name" type="text" /><input class="printer-id" type="number" /><select class="printer-priority"><option value="5">5</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select><select class="printer-default"><option value="false">No</option><option value="true">Yes</option></select><select class="printer-active"><option value="true">Yes</option><option value="false">No</option></select></div>

    <div id="msg" class="msg"></div>
  </div>
  <script>
    function show(text, ok) {
      const el = document.getElementById('msg');
      el.className = ok ? 'msg ok' : 'msg err';
      el.style.display = 'block';
      el.textContent = text;
    }
    function getAdminPassword() {
      const p = new URLSearchParams(window.location.search).get('admin') || '';
      return document.getElementById('adminPassword').value.trim() || p;
    }
    function getClientIdFromUrl() {
      return new URLSearchParams(window.location.search).get('clientId') || '';
    }
    function collectPrinters() {
      const names = document.querySelectorAll('.printer-name');
      const ids = document.querySelectorAll('.printer-id');
      const priorities = document.querySelectorAll('.printer-priority');
      const defaults = document.querySelectorAll('.printer-default');
      const actives = document.querySelectorAll('.printer-active');
      const printers = [];
      for (let i = 0; i < names.length; i++) {
        const printerIdValue = ids[i].value.trim();
        if (!printerIdValue) continue;
        printers.push({
          printer_id: Number(printerIdValue),
          printer_name: names[i].value.trim(),
          priority_order: Number(priorities[i].value),
          is_default: defaults[i].value === 'true',
          is_active: actives[i].value === 'true'
        });
      }
      return printers;
    }
    function fillPrinters(printers) {
      const names = document.querySelectorAll('.printer-name');
      const ids = document.querySelectorAll('.printer-id');
      const priorities = document.querySelectorAll('.printer-priority');
      const defaults = document.querySelectorAll('.printer-default');
      const actives = document.querySelectorAll('.printer-active');
      printers.slice(0,5).forEach((p, i) => {
        names[i].value = p.printer_name || '';
        ids[i].value = p.printer_id || '';
        priorities[i].value = String(p.priority_order || i + 1);
        defaults[i].value = p.is_default ? 'true' : 'false';
        actives[i].value = p.is_active ? 'true' : 'false';
      });
    }
    async function fetchPrinters() {
      const admin = getAdminPassword();
      const printnode_api_key = document.getElementById('printnodeApiKey').value.trim();
      if (!admin) return show('Enter admin password first', false);
      if (!printnode_api_key) return show('Enter PrintNode API Key first', false);
      const res = await fetch(`/admin/printnode/printers?admin=${encodeURIComponent(admin)}`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ printnode_api_key })
      });
      const data = await res.json();
      if (!data.ok) return show(data.error || 'Failed to fetch printers', false);
      const printers = data.printers.slice(0,5).map((p, i) => ({ printer_id:p.printer_id, printer_name:p.printer_name || p.computer_name || `Printer ${i+1}`, priority_order:i+1, is_default:i===0, is_active:true }));
      fillPrinters(printers);
      show(`Fetched ${printers.length} printer(s) successfully`, true);
    }
    async function loadExistingClient() {
      const admin = getAdminPassword();
      const clientId = getClientIdFromUrl();
      if (!admin || !clientId) return;
      const res = await fetch(`/admin/clients/${encodeURIComponent(clientId)}?admin=${encodeURIComponent(admin)}`);
      const data = await res.json();
      if (!data.ok) return show(data.error || 'Failed to load client', false);
      document.getElementById('name').value = data.client.name || '';
      document.getElementById('email').value = data.client.email || '';
      document.getElementById('webhookSecret').value = data.client.webhook_secret || '';
      document.getElementById('printnodeApiKey').value = data.client.printnode_api_key || '';
      document.getElementById('isActive').value = data.client.is_active ? 'true' : 'false';
      document.getElementById('setupCompleted').value = data.client.setup_completed ? 'true' : 'false';
      fillPrinters(data.printers || []);
      show('Client loaded for editing', true);
    }
    async function saveClient() {
      const admin = getAdminPassword();
      if (!admin) return show('Enter admin password first', false);
      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        webhook_secret: document.getElementById('webhookSecret').value.trim(),
        printnode_api_key: document.getElementById('printnodeApiKey').value.trim(),
        is_active: document.getElementById('isActive').value === 'true',
        setup_completed: document.getElementById('setupCompleted').value === 'true'
      };
      const printers = collectPrinters();
      const clientId = getClientIdFromUrl();
      let res;
      if (clientId) {
        res = await fetch(`/admin/clients/${encodeURIComponent(clientId)}?admin=${encodeURIComponent(admin)}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      } else {
        res = await fetch(`/admin/clients?admin=${encodeURIComponent(admin)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      }
      const data = await res.json();
      if (!data.ok) return show(data.error || 'Client save failed', false);
      const savedClientId = data.client.id;
      if (printers.length) {
        const pRes = await fetch(`/admin/clients/${savedClientId}/printers?admin=${encodeURIComponent(admin)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ printers }) });
        const pData = await pRes.json();
        if (!pData.ok) return show(pData.error || 'Printers save failed', false);
      }
      show('Client and printers saved successfully', true);
      if (!clientId) {
        const url = new URL(window.location.href);
        url.searchParams.set('clientId', savedClientId);
        url.searchParams.set('admin', admin);
        history.replaceState({}, '', url.toString());
      }
    }
    function goToClientsPage() {
      const admin = getAdminPassword();
      if (!admin) return show('Enter admin password first', false);
      location.href = `/admin/clients/page?admin=${encodeURIComponent(admin)}`;
    }
    const admin = new URLSearchParams(location.search).get('admin') || '';
    if (admin) document.getElementById('adminPassword').value = admin;
    loadExistingClient();
  </script>
</body>
</html>
